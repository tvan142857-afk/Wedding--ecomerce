# --- Co ban ---
server.port=8080
spring.application.name=wedding-shop

# --- Database mac dinh: H2 file (dev). File luu o ./data/weddingdb ---
spring.datasource.url=jdbc:h2:file:./data/weddingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT: lay tu bien moi truong, gia tri mac dinh CHI DUNG CHO DEV ---
# KHONG DUNG secret mac dinh nay cho production!
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-in-production-1234567890abcdef}
jwt.expiration-ms=86400000

# --- Thanh toan: cod | stripe (xem README) ---
payment.provider=${PAYMENT_PROVIDER:cod}
stripe.secret-key=${STRIPE_SECRET_KEY:}
